<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassIQ - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#F5F5F5] text-black font-sans antialiased">
    <!-- Shared Navbar Mount -->
    <div id="navbar-slot"></div>

    <main class="grid place-items-center min-h-[75vh] w-screen px-4">
      <div
        class="w-full bg-[#ECEDEF] max-w-[399px] rounded-[22px] flex flex-col justify-between p-8"
      >
        <div>
          <h1 class="text-2xl font-bold text-black text-center mb-10 mt-4">
            Login
          </h1>
          <form id="login-form" class="space-y-5" novalidate>
            <div>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="Enter Your Email"
                class="w-full px-4 py-3 bg-transparent border-[2px] border-black rounded-lg text-sm font-semibold text-black placeholder-black focus:outline-none focus:ring-1 focus:ring-black transition-colors"
              />
              <p
                id="login-email-error"
                class="text-red-600 text-xs font-semibold mt-1 hidden"
              ></p>
            </div>

            <div>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter Your Password"
                class="w-full px-4 py-3 bg-transparent border-[2px] border-black rounded-lg text-sm font-semibold text-black placeholder-black focus:outline-none focus:ring-1 focus:ring-black transition-colors"
              />
              <p
                id="login-password-error"
                class="text-red-600 text-xs font-semibold mt-1 hidden"
              ></p>
            </div>

            <button
              type="submit"
              class="bg-[#C2F578] hover:bg-[#b5eb67] transition-colors cursor-pointer px-[26px] font-semibold text-[18px] rounded-lg py-[11px] w-full"
            >
              Login
            </button>
          </form>
        </div>
        <p class="text-center text-sm font-semibold text-black mt-8">
          Don&apos;t have an account?
          <a href="signup.html" class="underline underline-offset-2 font-bold"
            >Sign Up</a
          >
        </p>
      </div>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
